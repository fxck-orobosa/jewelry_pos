<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aura Jewellers — Point of Sale</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="pos-layout">
        <!-- Main Product Catalog Area -->
        <main class="catalog-area">
            <header class="catalog-header">
                <div class="brand">
                    <h1>AURA <span>JEWELLERS</span></h1>
                    <p>Retail & Vault Point of Sale Terminal</p>
                </div>
                <div class="filter-controls">
                    <input type="text" id="searchInput" placeholder="Search piece, carat, or SKU...">
                    <div class="category-tabs" id="categoryTabs">
                        <button class="tab-btn active" data-category="all">All Items</button>
                        <button class="tab-btn" data-category="Rings">Rings</button>
                        <button class="tab-btn" data-category="Necklaces">Necklaces</button>
                        <button class="tab-btn" data-category="Bracelets">Bracelets</button>
                        <button class="tab-btn" data-category="Watches">Watches</button>
                        <button class="tab-btn" data-category="Earrings">Earrings</button>
                    </div>
                </div>
            </header>

            <div class="catalog-grid" id="productGrid">
                <!-- Injected via JavaScript -->
            </div>
        </main>

        <!-- Sidebar Cart & Checkout -->
        <aside class="cart-sidebar">
            <div class="cart-header">
                <h2>Current Sale</h2>
                <button class="btn-clear-cart" id="clearCartBtn">Reset</button>
            </div>

            <div class="cart-items" id="cartItemsContainer">
                <p class="empty-cart-msg">Cart is empty. Select inventory to begin sale.</p>
            </div>

            <div class="cart-summary">
                <div class="summary-line">
                    <span>Subtotal</span>
                    <span id="summarySubtotal">$0.00</span>
                </div>
                <div class="summary-line">
                    <span>Luxury Tax (7.5%)</span>
                    <span id="summaryTax">$0.00</span>
                </div>
                <div class="summary-line total-line">
                    <span>Total Due</span>
                    <span id="summaryTotal">$0.00</span>
                </div>

                <div class="payment-selection">
                    <label for="paymentMethod">Payment Method</label>
                    <select id="paymentMethod">
                        <option value="Card Terminal">Credit/Debit Terminal</option>
                        <option value="Cash">Cash Vault</option>
                        <option value="Bank Transfer">Direct Wire / Transfer</option>
                    </select>
                </div>

                <button class="btn-checkout" id="checkoutBtn" disabled>Complete Transaction</button>
            </div>
        </aside>
    </div>

    <!-- Receipt Modal -->
    <div class="modal-overlay" id="receiptModal">
        <div class="receipt-card">
            <div class="receipt-header">
                <h3>AURA JEWELLERS</h3>
                <p>Vault No. 402 &bull; Official Tax Invoice</p>
                <div class="receipt-meta">
                    <span id="receiptDate"></span>
                    <span id="receiptId"></span>
                </div>
            </div>
            <div class="receipt-divider"></div>
            <div class="receipt-body" id="receiptItems"></div>
            <div class="receipt-divider"></div>
            <div class="receipt-totals" id="receiptTotals"></div>
            <div class="receipt-footer">
                <p>All items certified authentic with lifetime polishing guarantee.</p>
                <button class="btn-print" onclick="window.print()">Print Invoice</button>
                <button class="btn-close" id="closeReceiptBtn">New Transaction</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
